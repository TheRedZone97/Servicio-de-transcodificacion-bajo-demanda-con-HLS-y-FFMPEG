services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: vod_transcoder_seaweedfs
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-hls-output}
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vod_transcoder_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  seaweedfs_data: